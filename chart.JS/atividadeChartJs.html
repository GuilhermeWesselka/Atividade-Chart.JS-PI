<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade do chartJS</title>
</head>
<body style="display: flex; flex-direction: column; align-items: center; font-family: 'Times New Roman', Times, serif; margin: 0; padding: 20px;" >
<h2><u>Controle Gráfico de Temperatura/Umidade de Morangos</u></h2>
<!--Criar canvas/Tela em branco-->
  <div style="display: flex; flex-direction: row; width: 100%; gap: 20px;">
    <div style="flex: 1;"><canvas id="myChart"></canvas></div>
    <div style="flex: 1;"><canvas id="myChart2"></canvas></div>
  </div>



</body>
</html>

<script>
    //Definir os gráficos
  const ctx = document.getElementById('myChart');
  const ctx2 = document.getElementById('myChart2');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura',
        backgroundColor: 'rgb(395, 2, 1)',
        borderColor: 'rgb(395, 2, 1)',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 1
      },
      {
        label: 'Umidade',
        backgroundColor: 'rgb(58, 125, 68)',
        borderColor: 'rgb(58, 125, 68)',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 1
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

   new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
      datasets: [{
        label: 'Temperatura Média',
        backgroundColor: 'rgb(395, 2, 1)',
        borderColor: 'rgb(395, 2, 1)',
        data: [22, 24, 27, 23, 20, 18],
        borderWidth: 1
      },
      {
        label: 'Umidade Média',
        backgroundColor: 'rgb(58, 125, 68)',
        borderColor: 'rgb(58, 125, 68)',
        data: [90, 89, 93, 87, 88, 82],
        borderWidth: 1
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
