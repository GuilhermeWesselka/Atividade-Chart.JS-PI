<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade do chartJS</title>
</head>
<body style="display: flex;" >

<!--Criar canvas/Tela em branco-->
<div>
  <canvas id="myChart" style="position: relative; height:40vh; width:40vw"></canvas></canvas>
</div>
<div>
  <canvas id="myChart2" style="position: relative; height:40vh; width:40vw"></canvas></canvas>
</div>




</body>
</html>

<script>
    //Definir os gráficos
  const ctx = document.getElementById('myChart');
  const ctx2 = document.getElementById('myChart2');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura',
        backgroundColor: 'rgb(255, 99, 132)',
        borderColor: 'rgb(255, 99, 132)',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 1
      },
      {
        label: 'Umidade',
        backgroundColor: 'rgb(15, 99, 255)',
        borderColor: 'rgb(15, 99, 255)',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 1
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

   new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
      datasets: [{
        label: 'Temperatura Média',
        backgroundColor: 'rgb(255, 99, 132)',
        borderColor: 'rgb(255, 99, 132)',
        data: [22, 24, 27, 23, 20, 18],
        borderWidth: 1
      },
      {
        label: 'Umidade Média',
        backgroundColor: 'rgb(15, 99, 255)',
        borderColor: 'rgb(15, 99, 255)',
        data: [90, 89, 93, 87, 88, 82],
        borderWidth: 1
      }
    ]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
